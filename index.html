<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Steinway Virtuel - Vrais Échantillons MP3</title>
  
  <!-- Intégration PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
    }

    h1 { margin-bottom: 5px; }
    p { color: #aaa; margin-bottom: 20px; }

    /* Panneau de contrôle */
    .controls {
      background: #2a2a2a;
      padding: 15px 25px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .status {
      font-weight: bold;
      color: #ffb74d;
    }

    .status.ready {
      color: #81c784;
    }

    .btn-rec {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    #btn-record { background-color: #e53935; color: white; }
    #btn-record:hover:not(:disabled) { background-color: #c62828; }
    #btn-stop { background-color: #555; color: white; }
    #btn-stop:hover:not(:disabled) { background-color: #777; }
    .btn-rec:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Piano UI */
    .piano {
      position: relative;
      display: flex;
      height: 220px;
      padding: 15px;
      background: #333;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .key-white {
      width: 55px;
      height: 100%;
      background: white;
      border: 1px solid #ccc;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      box-sizing: border-box;
      user-select: none;
      transition: background 0.05s, transform 0.05s;
    }

    .key-white.active {
      background: #ddd;
      transform: translateY(3px);
    }

    .key-black {
      width: 34px;
      height: 60%;
      background: #111;
      color: white;
      position: absolute;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      box-sizing: border-box;
      z-index: 2;
      user-select: none;
      box-shadow: 0 3px 5px rgba(0,0,0,0.5);
      transition: background 0.05s, transform 0.05s;
    }

    .key-black.active {
      background: #444;
      transform: translateY(3px);
    }

    #key-z { left: 52px; }
    #key-e { left: 108px; }
    #key-t { left: 220px; }
    #key-y { left: 276px; }
    #key-u { left: 332px; }
  </style>
</head>
<body>

  <h1>Piano Steinway Grand Piano</h1>
  <p>Sons réels échantillonnés • Touches AZERTY</p>

  <div class="controls">
    <div id="loading-status" class="status">⏳ Cliquez ou appuyez sur une touche pour charger...</div>

    <div>
      <button id="btn-record" class="btn-rec" disabled>🔴 Enregistrer</button>
      <button id="btn-stop" class="btn-rec" disabled>⏹️ Arrêter & Télécharger</button> 
    </div>
  </div>

  <div class="piano">
    <button class="key-white" data-key="q">Q<br>Do</button>
    <button class="key-white" data-key="s">S<br>Ré</button>
    <button class="key-white" data-key="d">D<br>Mi</button>
    <button class="key-white" data-key="f">F<br>Fa</button>
    <button class="key-white" data-key="g">G<br>Sol</button>
    <button class="key-white" data-key="h">H<br>La</button>
    <button class="key-white" data-key="j">J<br>Si</button>
    <button class="key-white" data-key="k">K<br>Do 2</button>

    <button class="key-black" id="key-z" data-key="z">Z<br>Do#</button>
    <button class="key-black" id="key-e" data-key="e">E<br>Ré#</button>
    <button class="key-black" id="key-t" data-key="t">T<br>Fa#</button>
    <button class="key-black" id="key-y" data-key="y">Y<br>Sol#</button>
    <button class="key-black" id="key-u" data-key="u">U<br>La#</button>
  </div>

  <script>
    // Dictionnaire avec l'index MIDI de chaque note (C4/Do = 60)
    const keyNotes = {
      'q': { name: 'C4',  midi: 60 }, // Do 4
      'z': { name: 'C#4', midi: 61 }, // Do# 4
      's': { name: 'D4',  midi: 62 }, // Ré 4
      'e': { name: 'D#4', midi: 63 }, // Ré# 4
      'd': { name: 'E4',  midi: 64 }, // Mi 4
      'f': { name: 'F4',  midi: 65 }, // Fa 4
      't': { name: 'F#4', midi: 66 }, // Fa# 4
      'g': { name: 'G4',  midi: 67 }, // Sol 4
      'y': { name: 'G#4', midi: 68 }, // Sol# 4
      'h': { name: 'A4',  midi: 69 }, // La 4
      'u': { name: 'A#4', midi: 70 }, // La# 4
      'j': { name: 'B4',  midi: 71 }, // Si 4
      'k': { name: 'C5',  midi: 72 }  // Do 5
    };

    // Échantillons MP3 de référence issus d'un vrai Steinway
    const sampleFiles = {
      60: 'https://tonejs.github.io/audio/salamander/C4.mp3',
      63: 'https://tonejs.github.io/audio/salamander/Ds4.mp3',
      66: 'https://tonejs.github.io/audio/salamander/Fs4.mp3',
      69: 'https://tonejs.github.io/audio/salamander/A4.mp3',
      72: 'https://tonejs.github.io/audio/salamander/C5.mp3'
    };

    let audioContext;
    let masterGain;
    let streamDestination;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    const audioBuffers = {}; // Stocke les AudioBuffer décodés
    const activeNotes = {};  // Stocke les nœuds actifs

    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      if (!masterGain) {
        masterGain = audioContext.createGain();
        masterGain.gain.setValueAtTime(0.9, audioContext.currentTime);
        masterGain.connect(audioContext.destination);

        streamDestination = audioContext.createMediaStreamDestination();
        masterGain.connect(streamDestination);
      }
    }

    // --- PRÉCHARGEMENT DES FICHIERS MP3 ---
    async function loadSamples() {
      initAudioContext();
      const statusEl = document.getElementById('loading-status');
      statusEl.textContent = "⏳ Chargement des sons Steinway...";

      try {
        const promises = Object.entries(sampleFiles).map(async ([midi, url]) => {
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          const decodedBuffer = await audioContext.decodeAudioData(arrayBuffer);
          audioBuffers[midi] = decodedBuffer;
        });

        await Promise.all(promises);

        statusEl.textContent = "🎹 Piano Steinway Prêt !";
        statusEl.classList.add('ready');
        document.getElementById('btn-record').disabled = false;
      } catch (err) {
        console.error("Erreur de chargement des MP3:", err);
        statusEl.textContent = "❌ Erreur de chargement des MP3";
      }
    }

    // Trouve l'échantillon MP3 le plus proche
    function getClosestSample(targetMidi) {
      const availableMidis = Object.keys(audioBuffers).map(Number);
      return availableMidis.reduce((prev, curr) => 
        Math.abs(curr - targetMidi) < Math.abs(prev - targetMidi) ? curr : prev
      );
    }

    // --- DÉCLENCHEMENT DE LA NOTE MP3 ---
    function noteOn(key) {
      initAudioContext();
      if (!keyNotes[key] || activeNotes[key]) return;

      const targetMidi = keyNotes[key].midi;
      const baseMidi = getClosestSample(targetMidi);
      const buffer = audioBuffers[baseMidi];

      if (!buffer) return;

      const source = audioContext.createBufferSource();
      source.buffer = buffer;

      // Pitch Shift
      const semitoneDifference = targetMidi - baseMidi;
      source.playbackRate.value = Math.pow(2, semitoneDifference / 12);

      const noteGain = audioContext.createGain();
      noteGain.gain.setValueAtTime(1.0, audioContext.currentTime);

      source.connect(noteGain);
      noteGain.connect(masterGain);

      source.start(0);

      activeNotes[key] = { source, noteGain };
    }

    // --- EXTINCTION DU SON ---
    function noteOff(key) {
      const note = activeNotes[key];
      if (!note) return;

      const now = audioContext.currentTime;
      const releaseTime = 0.5;

      note.noteGain.gain.cancelScheduledValues(now);
      note.noteGain.gain.setValueAtTime(note.noteGain.gain.value, now);
      note.noteGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);

      note.source.stop(now + releaseTime);

      setTimeout(() => {
        note.source.disconnect();
        note.noteGain.disconnect();
      }, releaseTime * 1000);

      delete activeNotes[key];
    }

    // --- ENREGISTREUR AUDIO ---
    const btnRecord = document.getElementById('btn-record');
    const btnStop = document.getElementById('btn-stop');

    btnRecord.addEventListener('click', () => {
      initAudioContext();
      audioChunks = [];
      mediaRecorder = new MediaRecorder(streamDestination.stream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(audioBlob);
        const link = document.createElement('a');
        link.href = audioUrl;
        link.download = `steinway-rec-${Date.now()}.webm`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.disabled = true;
      btnStop.disabled = false;
      btnRecord.textContent = "⏺️ Enregistrement...";
    });

    btnStop.addEventListener('click', () => {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnRecord.disabled = false;
        btnStop.disabled = true;
        btnRecord.textContent = "🔴 Enregistrer";
      }
    });

    // --- ÉVÉNEMENTS CLAVIER ET SOURIS ---
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const key = e.key.toLowerCase();
      if (keyNotes[key]) {
        noteOn(key);
        document.querySelector(`[data-key="${key}"]`)?.classList.add('active');
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (keyNotes[key]) {
        noteOff(key);
        document.querySelector(`[data-key="${key}"]`)?.classList.remove('active');
      }
    });

    document.querySelectorAll('.piano button').forEach(button => {
      const key = button.getAttribute('data-key');
      button.addEventListener('mousedown', () => {
        noteOn(key);
        button.classList.add('active');
      });
      const stopAction = () => {
        noteOff(key);
        button.classList.remove('active');
      };
      button.addEventListener('mouseup', stopAction);
      button.addEventListener('mouseleave', stopAction);
    });

    // Lancement du chargement au premier survol ou clic
    window.addEventListener('click', loadSamples, { once: true });
    window.addEventListener('keydown', loadSamples, { once: true });

    // --- ENREGISTREMENT DU SERVICE WORKER (Corrigé) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ Service Worker enregistré avec succès :', reg.scope))
          .catch(err => console.error("❌ Échec de l'enregistrement du Service Worker :", err));
      });
    }
  </script>
</body>
</html>
