<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Steinway Virtuel Pro - Partitions</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #121212;
      color: white;
      margin: 0;
      user-select: none;
    }

    h1 { margin-bottom: 2px; }
    p { color: #aaa; margin-bottom: 10px; font-size: 0.9rem; }

    .dashboard {
      background: #222;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      max-width: 680px;
      width: 90%;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
    }

    .status {
      font-weight: bold;
      color: #ffb74d;
      font-size: 0.85rem;
    }

    .status.ready { color: #81c784; }

    .control-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .btn-guide { background-color: #ffd54f; color: #111; }
    .btn-guide:hover { background-color: #ffca28; }
    .btn-rec { background-color: #e53935; color: white; }
    .btn-stop { background-color: #555; color: white; }
    .btn-octave { background-color: #333; color: white; border: 1px solid #555; }
    .btn-install { background-color: #0288d1; color: white; display: none; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .widget-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      font-size: 0.85rem;
    }

    select {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Panneau de Partition Guidée (Caché par défaut) */
    .sheet-music-box {
      width: 100%;
      background: #181818;
      border: 2px solid #ffd54f;
      border-radius: 8px;
      padding: 10px;
      box-sizing: border-box;
      text-align: center;
      display: none; /* Masqué au départ */
    }

    .sheet-music-box.visible {
      display: block; /* S'affiche au clic sur le bouton */
    }

    .sheet-title {
      font-weight: bold;
      color: #ffd54f;
      margin-bottom: 5px;
      font-size: 0.95rem;
    }

    .notes-display {
      display: flex;
      gap: 8px;
      justify-content: center;
      overflow-x: auto;
      padding: 8px 0;
    }

    .note-badge {
      background: #333;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      color: #aaa;
      border: 1px solid #444;
      min-width: 25px;
    }

    .note-badge.target {
      background: #ffd54f;
      color: #111;
      border-color: #fff;
      transform: scale(1.15);
      box-shadow: 0 0 10px rgba(255, 213, 79, 0.8);
    }

    .note-badge.done {
      background: #2e7d32;
      color: #a5d6a7;
      border-color: #4caf50;
      opacity: 0.5;
    }

    /* Piano UI */
    .piano {
      position: relative;
      display: flex;
      height: 220px;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .key-white {
      width: 55px;
      height: 100%;
      background: linear-gradient(to bottom, #fff 0%, #eee 100%);
      border: 1px solid #ccc;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      box-sizing: border-box;
      transition: background 0.05s, transform 0.05s;
    }

    .key-white.active { background: #bbb; transform: translateY(3px); }
    
    .key-white.guide {
      background: #ffe082 !important;
      box-shadow: 0 0 15px #ffd54f;
    }

    .key-black {
      width: 34px;
      height: 60%;
      background: linear-gradient(to bottom, #333 0%, #000 100%);
      color: white;
      position: absolute;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      box-sizing: border-box;
      z-index: 2;
      box-shadow: 0 3px 5px rgba(0,0,0,0.5);
      transition: background 0.05s, transform 0.05s;
    }

    .key-black.active { background: #555; transform: translateY(3px); }

    .key-black.guide {
      background: #ffb300 !important;
      box-shadow: 0 0 15px #ffb300;
    }

    #key-z { left: 52px; }
    #key-e { left: 108px; }
    #key-t { left: 220px; }
    #key-y { left: 276px; }
    #key-u { left: 332px; }
  </style>
</head>
<body>

  <h1>Piano Steinway Grand Pro</h1>
  <p>Pédale (Espace) • Octave (Flèches ⬅️ ➡️)</p>

  <div class="dashboard">
    <div class="status-bar">
      <div id="loading-status" class="status">⏳ Cliquez ou appuyez sur une touche...</div>
      <button id="btn-install" class="btn btn-install">📲 Installer l'App</button>
    </div>

    <div class="control-row">
      <!-- Bouton pour afficher/masquer le guide -->
      <button id="btn-toggle-guide" class="btn btn-guide">🎼 Guide d'apprentissage</button>

      <!-- Enregistreur -->
      <div>
        <button id="btn-record" class="btn btn-rec" disabled>🔴 Enregistrer</button>
        <button id="btn-stop" class="btn btn-stop" disabled>⏹️ Télécharger</button> 
      </div>

      <!-- Selecteur d'octave -->
      <div class="widget-box">
        <span>Octave:</span>
        <button id="btn-octave-down" class="btn btn-octave">◀</button>
        <span id="octave-label" style="font-weight:bold; color:#ffb74d;">Oct 4</span>
        <button id="btn-octave-up" class="btn btn-octave">▶</button>
      </div>
    </div>

    <!-- Panneau du Guide (Masqué par défaut) -->
    <div id="sheet-box" class="sheet-music-box">
      <div class="control-row" style="margin-bottom:8px;">
        <span class="sheet-title">Sélectionner un morceau :</span>
        <select id="song-select">
          <option value="none">-- Choisir un morceau --</option>
          <option value="breakaway">Breakaway (Kelly Clarkson)</option>
          <option value="clair_de_lune">Au clair de la lune</option>
          <option value="hymne_joie">Hymne à la joie</option>
          <option value="frere_jacques">Frère Jacques</option>
          <option value="lettre_elise">Lettre à Élise (Extrait)</option>
        </select>
        <button id="btn-reset-song" class="btn btn-octave">↩️ Recommencer</button>
      </div>
      <div id="notes-container" class="notes-display">
        <span style="color:#777;">Choisissez une chanson dans la liste.</span>
      </div>
    </div>
  </div>

  <div class="piano">
    <button class="key-white" data-key="q">Q<br>Do</button>
    <button class="key-white" data-key="s">S<br>Ré</button>
    <button class="key-white" data-key="d">D<br>Mi</button>
    <button class="key-white" data-key="f">F<br>Fa</button>
    <button class="key-white" data-key="g">G<br>Sol</button>
    <button class="key-white" data-key="h">H<br>La</button>
    <button class="key-white" data-key="j">J<br>Si</button>
    <button class="key-white" data-key="k">K<br>Do 2</button>

    <button class="key-black" id="key-z" data-key="z">Z<br>Do#</button>
    <button class="key-black" id="key-e" data-key="e">E<br>Ré#</button>
    <button class="key-black" id="key-t" data-key="t">T<br>Fa#</button>
    <button class="key-black" id="key-y" data-key="y">Y<br>Sol#</button>
    <button class="key-black" id="key-u" data-key="u">U<br>La#</button>
  </div>

  <script>
    const keyNotes = {
      'q': { name: 'C',  midi: 60, label: 'Do' },
      'z': { name: 'C#', midi: 61, label: 'Do#' },
      's': { name: 'D',  midi: 62, label: 'Ré' },
      'e': { name: 'D#', midi: 63, label: 'Ré#' },
      'd': { name: 'E',  midi: 64, label: 'Mi' },
      'f': { name: 'F',  midi: 65, label: 'Fa' },
      't': { name: 'F#', midi: 66, label: 'Fa#' },
      'g': { name: 'G',  midi: 67, label: 'Sol' },
      'y': { name: 'G#', midi: 68, label: 'Sol#' },
      'h': { name: 'A',  midi: 69, label: 'La' },
      'u': { name: 'A#', midi: 70, label: 'La#' },
      'j': { name: 'B',  midi: 71, label: 'Si' },
      'k': { name: 'C2', midi: 72, label: 'Do2' }
    };

    const sampleFiles = {
      60: 'https://tonejs.github.io/audio/salamander/C4.mp3',
      63: 'https://tonejs.github.io/audio/salamander/Ds4.mp3',
      66: 'https://tonejs.github.io/audio/salamander/Fs4.mp3',
      69: 'https://tonejs.github.io/audio/salamander/A4.mp3',
      72: 'https://tonejs.github.io/audio/salamander/C5.mp3'
    };

    const songs = {
      breakaway: [
        { key: 'q', label: 'Do' }, { key: 'q', label: 'Do' }, { key: 's', label: 'Ré' }, { key: 'd', label: 'Mi' },
        { key: 'd', label: 'Mi' }, { key: 's', label: 'Ré' }, { key: 'q', label: 'Do' }, { key: 's', label: 'Ré' },
        { key: 'd', label: 'Mi' }, { key: 'g', label: 'Sol' }, { key: 'f', label: 'Fa' }, { key: 'd', label: 'Mi' },
        { key: 's', label: 'Ré' }, { key: 'q', label: 'Do' }
      ],
      clair_de_lune: [
        { key: 'q', label: 'Do' }, { key: 'q', label: 'Do' }, { key: 'q', label: 'Do' }, { key: 's', label: 'Ré' },
        { key: 'd', label: 'Mi' }, { key: 's', label: 'Ré' }, { key: 'q', label: 'Do' }, { key: 'd', label: 'Mi' },
        { key: 's', label: 'Ré' }, { key: 's', label: 'Ré' }, { key: 'q', label: 'Do' }
      ],
      hymne_joie: [
        { key: 'd', label: 'Mi' }, { key: 'd', label: 'Mi' }, { key: 'f', label: 'Fa' }, { key: 'g', label: 'Sol' },
        { key: 'g', label: 'Sol' }, { key: 'f', label: 'Fa' }, { key: 'd', label: 'Mi' }, { key: 's', label: 'Ré' },
        { key: 'q', label: 'Do' }, { key: 'q', label: 'Do' }, { key: 's', label: 'Ré' }, { key: 'd', label: 'Mi' },
        { key: 'd', label: 'Mi' }, { key: 's', label: 'Ré' }, { key: 's', label: 'Ré' }
      ],
      frere_jacques: [
        { key: 'q', label: 'Do' }, { key: 's', label: 'Ré' }, { key: 'd', label: 'Mi' }, { key: 'q', label: 'Do' },
        { key: 'q', label: 'Do' }, { key: 's', label: 'Ré' }, { key: 'd', label: 'Mi' }, { key: 'q', label: 'Do' },
        { key: 'd', label: 'Mi' }, { key: 'f', label: 'Fa' }, { key: 'g', label: 'Sol' },
        { key: 'd', label: 'Mi' }, { key: 'f', label: 'Fa' }, { key: 'g', label: 'Sol' }
      ],
      lettre_elise: [
        { key: 'k', label: 'Do2' }, { key: 'j', label: 'Si' }, { key: 'k', label: 'Do2' }, { key: 'j', label: 'Si' },
        { key: 'k', label: 'Do2' }, { key: 'h', label: 'La' }, { key: 'g', label: 'Sol' }, { key: 'f', label: 'Fa' }
      ]
    };

    let currentSong = [];
    let currentNoteIndex = 0;

    let audioContext, masterGain, streamDestination, mediaRecorder;
    let audioChunks = [], isRecording = false, octaveShift = 0;
    const audioBuffers = {}, activeNotes = {};

    // Afficher / Masquer le panneau avec le bouton
    const btnToggleGuide = document.getElementById('btn-toggle-guide');
    const sheetBox = document.getElementById('sheet-box');

    btnToggleGuide.addEventListener('click', () => {
      sheetBox.classList.toggle('visible');
    });

    function initAudioContext() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      if (!masterGain) {
        masterGain = audioContext.createGain();
        masterGain.gain.setValueAtTime(0.9, audioContext.currentTime);
        masterGain.connect(audioContext.destination);
        streamDestination = audioContext.createMediaStreamDestination();
        masterGain.connect(streamDestination);
      }
    }

    async function loadSamples() {
      initAudioContext();
      const statusEl = document.getElementById('loading-status');
      statusEl.textContent = "⏳ Chargement des sons Steinway...";
      try {
        const promises = Object.entries(sampleFiles).map(async ([midi, url]) => {
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          audioBuffers[midi] = await audioContext.decodeAudioData(arrayBuffer);
        });
        await Promise.all(promises);
        statusEl.textContent = "🎹 Piano Steinway Prêt !";
        statusEl.classList.add('ready');
        document.getElementById('btn-record').disabled = false;
      } catch (err) {
        statusEl.textContent = "❌ Erreur de chargement";
      }
    }

    function getClosestSample(targetMidi) {
      const availableMidis = Object.keys(audioBuffers).map(Number);
      return availableMidis.reduce((prev, curr) => 
        Math.abs(curr - targetMidi) < Math.abs(prev - targetMidi) ? curr : prev
      );
    }

    function noteOn(key) {
      initAudioContext();
      if (!keyNotes[key] || activeNotes[key]) return;

      const targetMidi = keyNotes[key].midi + (octaveShift * 12);
      const baseMidi = getClosestSample(targetMidi);
      const buffer = audioBuffers[baseMidi];
      if (!buffer) return;

      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.playbackRate.value = Math.pow(2, (targetMidi - baseMidi) / 12);

      const noteGain = audioContext.createGain();
      noteGain.gain.setValueAtTime(1.0, audioContext.currentTime);

      source.connect(noteGain);
      noteGain.connect(masterGain);
      source.start(0);

      activeNotes[key] = { source, noteGain };

      if (currentSong.length > 0 && currentNoteIndex < currentSong.length) {
        if (key === currentSong[currentNoteIndex].key) {
          currentNoteIndex++;
          renderSong();
        }
      }
    }

    function noteOff(key) {
      const note = activeNotes[key];
      if (!note) return;

      const now = audioContext.currentTime;
      note.noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
      note.source.stop(now + 0.5);

      setTimeout(() => {
        note.source.disconnect();
        note.noteGain.disconnect();
      }, 500);

      delete activeNotes[key];
    }

    function renderSong() {
      const container = document.getElementById('notes-container');
      document.querySelectorAll('.piano button').forEach(b => b.classList.remove('guide'));

      if (currentSong.length === 0) {
        container.innerHTML = '<span style="color:#777;">Choisissez une chanson dans la liste.</span>';
        return;
      }

      if (currentNoteIndex >= currentSong.length) {
        container.innerHTML = '🎉 <b style="color:#81c784;">Bravo ! Vous avez terminé ce morceau !</b>';
        return;
      }

      container.innerHTML = '';
      currentSong.forEach((note, idx) => {
        const badge = document.createElement('div');
        badge.className = 'note-badge';
        badge.textContent = note.label;

        if (idx < currentNoteIndex) {
          badge.classList.add('done');
        } else if (idx === currentNoteIndex) {
          badge.classList.add('target');
          const keyButton = document.querySelector(`[data-key="${note.key}"]`);
          if (keyButton) keyButton.classList.add('guide');
        }

        container.appendChild(badge);
      });
    }

    document.getElementById('song-select').addEventListener('change', (e) => {
      const selected = e.target.value;
      if (songs[selected]) {
        currentSong = songs[selected];
        currentNoteIndex = 0;
      } else {
        currentSong = [];
        currentNoteIndex = 0;
      }
      renderSong();
    });

    document.getElementById('btn-reset-song').addEventListener('click', () => {
      currentNoteIndex = 0;
      renderSong();
    });

    function updateOctave(delta) {
      octaveShift = Math.max(-2, Math.min(2, octaveShift + delta));
      document.getElementById('octave-label').textContent = `Oct ${4 + octaveShift}`;
    }
    document.getElementById('btn-octave-down').addEventListener('click', () => updateOctave(-1));
    document.getElementById('btn-octave-up').addEventListener('click', () => updateOctave(1));

    const btnRecord = document.getElementById('btn-record');
    const btnStop = document.getElementById('btn-stop');

    btnRecord.addEventListener('click', () => {
      initAudioContext();
      audioChunks = [];
      mediaRecorder = new MediaRecorder(streamDestination.stream);
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(audioBlob);
        const link = document.createElement('a');
        link.href = audioUrl;
        link.download = `steinway-rec-${Date.now()}.webm`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };
      mediaRecorder.start();
      isRecording = true;
      btnRecord.disabled = true;
      btnStop.disabled = false;
      btnRecord.textContent = "⏺️ Enregistrement...";
    });

    btnStop.addEventListener('click', () => {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnRecord.disabled = false;
        btnStop.disabled = true;
        btnRecord.textContent = "🔴 Enregistrer";
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.code === 'ArrowLeft') { updateOctave(-1); return; }
      if (e.code === 'ArrowRight') { updateOctave(1); return; }

      const key = e.key.toLowerCase();
      if (keyNotes[key]) {
        noteOn(key);
        document.querySelector(`[data-key="${key}"]`)?.classList.add('active');
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (keyNotes[key]) {
        noteOff(key);
        document.querySelector(`[data-key="${key}"]`)?.classList.remove('active');
      }
    });

    document.querySelectorAll('.piano button').forEach(button => {
      const key = button.getAttribute('data-key');
      button.addEventListener('mousedown', () => {
        noteOn(key);
        button.classList.add('active');
      });
      const stopAction = () => {
        noteOff(key);
        button.classList.remove('active');
      };
      button.addEventListener('mouseup', stopAction);
      button.addEventListener('mouseleave', stopAction);
    });

    window.addEventListener('click', loadSamples, { once: true });
    window.addEventListener('keydown', loadSamples, { once: true });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
