<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piano Steinway Virtuel Pro</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #121212;
      color: white;
      margin: 0;
      user-select: none;
    }

    h1 { margin-bottom: 2px; }
    p { color: #aaa; margin-bottom: 15px; font-size: 0.95rem; }

    /* Panneau de contrôle */
    .dashboard {
      background: #222;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      max-width: 650px;
      width: 90%;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
    }

    .status {
      font-weight: bold;
      color: #ffb74d;
      font-size: 0.9rem;
    }

    .status.ready { color: #81c784; }

    .control-row {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .btn-rec { background-color: #e53935; color: white; }
    .btn-rec:hover:not(:disabled) { background-color: #c62828; }
    .btn-stop { background-color: #555; color: white; }
    .btn-stop:hover:not(:disabled) { background-color: #777; }
    .btn-octave { background-color: #333; color: white; border: 1px solid #555; }
    .btn-octave:hover { background-color: #444; }
    .btn-install { background-color: #0288d1; color: white; display: none; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Métronome & Sustain UI */
    .widget-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #333;
      font-size: 0.85rem;
    }

    .pedal-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #555;
      transition: background 0.1s;
    }

    .pedal-indicator.active {
      background: #4caf50;
      box-shadow: 0 0 8px #4caf50;
    }

    /* Piano UI */
    .piano {
      position: relative;
      display: flex;
      height: 220px;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .key-white {
      width: 55px;
      height: 100%;
      background: linear-gradient(to bottom, #fff 0%, #eee 100%);
      border: 1px solid #ccc;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      box-sizing: border-box;
      transition: background 0.05s, transform 0.05s;
    }

    .key-white.active {
      background: #ddd;
      transform: translateY(3px);
    }

    .key-black {
      width: 34px;
      height: 60%;
      background: linear-gradient(to bottom, #333 0%, #000 100%);
      color: white;
      position: absolute;
      border-radius: 0 0 4px 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      box-sizing: border-box;
      z-index: 2;
      box-shadow: 0 3px 5px rgba(0,0,0,0.5);
      transition: background 0.05s, transform 0.05s;
    }

    .key-black.active {
      background: #555;
      transform: translateY(3px);
    }

    #key-z { left: 52px; }
    #key-e { left: 108px; }
    #key-t { left: 220px; }
    #key-y { left: 276px; }
    #key-u { left: 332px; }

    .octave-display {
      font-weight: bold;
      color: #ffb74d;
      min-width: 60px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Piano Steinway Grand Pro</h1>
  <p>Pédale (Espace) • Octave (Flèches ⬅️ ➡️) • Métronome</p>

  <div class="dashboard">
    <div class="status-bar">
      <div id="loading-status" class="status">⏳ Cliquez ou appuyez sur une touche...</div>
      <button id="btn-install" class="btn btn-install">📲 Installer l'App</button>
    </div>

    <div class="control-row">
      <!-- Enregistreur -->
      <div>
        <button id="btn-record" class="btn btn-rec" disabled>🔴 Enregistrer</button>
        <button id="btn-stop" class="btn btn-stop" disabled>⏹️ Télécharger</button> 
      </div>

      <!-- Selecteur d'octave -->
      <div class="widget-box">
        <span>Octave:</span>
        <button id="btn-octave-down" class="btn btn-octave">◀</button>
        <span id="octave-label" class="octave-display">Oct 4</span>
        <button id="btn-octave-up" class="btn btn-octave">▶</button>
      </div>

      <!-- Pédale indicator -->
      <div class="widget-box">
        <span id="pedal-light" class="pedal-indicator"></span>
        <span>Sustain (Espace)</span>
      </div>
    </div>

    <div class="control-row">
      <!-- Métronome -->
      <div class="widget-box">
        <span>⏱️ Métronome:</span>
        <input type="range" id="metro-bpm" min="40" max="200" value="120">
        <span id="bpm-val">120 BPM</span>
        <button id="btn-metro" class="btn btn-octave">▶ Start</button>
      </div>
    </div>
  </div>

  <div class="piano">
    <button class="key-white" data-key="q">Q<br>Do</button>
    <button class="key-white" data-key="s">S<br>Ré</button>
    <button class="key-white" data-key="d">D<br>Mi</button>
    <button class="key-white" data-key="f">F<br>Fa</button>
    <button class="key-white" data-key="g">G<br>Sol</button>
    <button class="key-white" data-key="h">H<br>La</button>
    <button class="key-white" data-key="j">J<br>Si</button>
    <button class="key-white" data-key="k">K<br>Do 2</button>

    <button class="key-black" id="key-z" data-key="z">Z<br>Do#</button>
    <button class="key-black" id="key-e" data-key="e">E<br>Ré#</button>
    <button class="key-black" id="key-t" data-key="t">T<br>Fa#</button>
    <button class="key-black" id="key-y" data-key="y">Y<br>Sol#</button>
    <button class="key-black" id="key-u" data-key="u">U<br>La#</button>
  </div>

  <script>
    // Configuration des notes de base (Octave 4 par défaut)
    const keyNotes = {
      'q': { name: 'C',  midi: 60 },
      'z': { name: 'C#', midi: 61 },
      's': { name: 'D',  midi: 62 },
      'e': { name: 'D#', midi: 63 },
      'd': { name: 'E',  midi: 64 },
      'f': { name: 'F',  midi: 65 },
      't': { name: 'F#', midi: 66 },
      'g': { name: 'G',  midi: 67 },
      'y': { name: 'G#', midi: 68 },
      'h': { name: 'A',  midi: 69 },
      'u': { name: 'A#', midi: 70 },
      'j': { name: 'B',  midi: 71 },
      'k': { name: 'C2', midi: 72 }
    };

    const sampleFiles = {
      60: 'https://tonejs.github.io/audio/salamander/C4.mp3',
      63: 'https://tonejs.github.io/audio/salamander/Ds4.mp3',
      66: 'https://tonejs.github.io/audio/salamander/Fs4.mp3',
      69: 'https://tonejs.github.io/audio/salamander/A4.mp3',
      72: 'https://tonejs.github.io/audio/salamander/C5.mp3'
    };

    let audioContext;
    let masterGain;
    let streamDestination;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    let octaveShift = 0; // -2 à +2
    let isSustainActive = false;
    const sustainedNotesToRelease = new Set();

    const audioBuffers = {};
    const activeNotes = {};

    function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      if (!masterGain) {
        masterGain = audioContext.createGain();
        masterGain.gain.setValueAtTime(0.9, audioContext.currentTime);
        masterGain.connect(audioContext.destination);

        streamDestination = audioContext.createMediaStreamDestination();
        masterGain.connect(streamDestination);
      }
    }

    async function loadSamples() {
      initAudioContext();
      const statusEl = document.getElementById('loading-status');
      statusEl.textContent = "⏳ Chargement des sons Steinway...";

      try {
        const promises = Object.entries(sampleFiles).map(async ([midi, url]) => {
          const response = await fetch(url);
          const arrayBuffer = await response.arrayBuffer();
          audioBuffers[midi] = await audioContext.decodeAudioData(arrayBuffer);
        });

        await Promise.all(promises);
        statusEl.textContent = "🎹 Piano Steinway Prêt !";
        statusEl.classList.add('ready');
        document.getElementById('btn-record').disabled = false;
      } catch (err) {
        console.error("Erreur de chargement des MP3:", err);
        statusEl.textContent = "❌ Erreur de chargement";
      }
    }

    function getClosestSample(targetMidi) {
      const availableMidis = Object.keys(audioBuffers).map(Number);
      return availableMidis.reduce((prev, curr) => 
        Math.abs(curr - targetMidi) < Math.abs(prev - targetMidi) ? curr : prev
      );
    }

    // --- JOUER UNE NOTE ---
    function noteOn(key) {
      initAudioContext();
      if (!keyNotes[key] || activeNotes[key]) return;

      const targetMidi = keyNotes[key].midi + (octaveShift * 12);
      const baseMidi = getClosestSample(targetMidi);
      const buffer = audioBuffers[baseMidi];

      if (!buffer) return;

      const source = audioContext.createBufferSource();
      source.buffer = buffer;

      const semitoneDifference = targetMidi - baseMidi;
      source.playbackRate.value = Math.pow(2, semitoneDifference / 12);

      const noteGain = audioContext.createGain();
      noteGain.gain.setValueAtTime(1.0, audioContext.currentTime);

      source.connect(noteGain);
      noteGain.connect(masterGain);

      source.start(0);
      activeNotes[key] = { source, noteGain };
    }

    // --- ARRÊTER UNE NOTE (avec Sustain) ---
    function noteOff(key) {
      const note = activeNotes[key];
      if (!note) return;

      if (isSustainActive) {
        sustainedNotesToRelease.add(key);
        return;
      }

      const now = audioContext.currentTime;
      const releaseTime = 0.6;

      note.noteGain.gain.cancelScheduledValues(now);
      note.noteGain.gain.setValueAtTime(note.noteGain.gain.value, now);
      note.noteGain.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);

      note.source.stop(now + releaseTime);

      setTimeout(() => {
        note.source.disconnect();
        note.noteGain.disconnect();
      }, releaseTime * 1000);

      delete activeNotes[key];
      sustainedNotesToRelease.delete(key);
    }

    // --- PÉDALE DE SUSTAIN (Espace) ---
    function setSustain(active) {
      isSustainActive = active;
      const light = document.getElementById('pedal-light');
      
      if (active) {
        light.classList.add('active');
      } else {
        light.classList.remove('active');
        // Relâcher toutes les notes en attente
        sustainedNotesToRelease.forEach(key => noteOff(key));
      }
    }

    // --- CHANGEMENT D'OCTAVE ---
    function updateOctave(delta) {
      octaveShift = Math.max(-2, Math.min(2, octaveShift + delta));
      document.getElementById('octave-label').textContent = `Oct ${4 + octaveShift}`;
    }

    document.getElementById('btn-octave-down').addEventListener('click', () => updateOctave(-1));
    document.getElementById('btn-octave-up').addEventListener('click', () => updateOctave(1));

    // --- MÉTRO NOME ---
    let metroInterval;
    let isMetroRunning = false;
    const btnMetro = document.getElementById('btn-metro');
    const metroBpmInput = document.getElementById('metro-bpm');
    const bpmValDisplay = document.getElementById('bpm-val');

    metroBpmInput.addEventListener('input', (e) => {
      bpmValDisplay.textContent = `${e.target.value} BPM`;
      if (isMetroRunning) {
        stopMetronome();
        startMetronome();
      }
    });

    function playClick() {
      initAudioContext();
      const osc = audioContext.createOscillator();
      const clickGain = audioContext.createGain();
      osc.frequency.value = 1000;
      clickGain.gain.setValueAtTime(0.3, audioContext.currentTime);
      clickGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.05);

      osc.connect(clickGain);
      clickGain.connect(masterGain);
      osc.start();
      osc.stop(audioContext.currentTime + 0.05);
    }

    function startMetronome() {
      const bpm = parseInt(metroBpmInput.value, 10);
      const intervalMs = (60 / bpm) * 1000;
      playClick();
      metroInterval = setInterval(playClick, intervalMs);
      isMetroRunning = true;
      btnMetro.textContent = "⏹ Stop";
    }

    function stopMetronome() {
      clearInterval(metroInterval);
      isMetroRunning = false;
      btnMetro.textContent = "▶ Start";
    }

    btnMetro.addEventListener('click', () => {
      if (isMetroRunning) stopMetronome();
      else startMetronome();
    });

    // --- ENREGISTREUR ---
    const btnRecord = document.getElementById('btn-record');
    const btnStop = document.getElementById('btn-stop');

    btnRecord.addEventListener('click', () => {
      initAudioContext();
      audioChunks = [];
      mediaRecorder = new MediaRecorder(streamDestination.stream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(audioBlob);
        const link = document.createElement('a');
        link.href = audioUrl;
        link.download = `steinway-rec-${Date.now()}.webm`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      mediaRecorder.start();
      isRecording = true;
      btnRecord.disabled = true;
      btnStop.disabled = false;
      btnRecord.textContent = "⏺️ Enregistrement...";
    });

    btnStop.addEventListener('click', () => {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnRecord.disabled = false;
        btnStop.disabled = true;
        btnRecord.textContent = "🔴 Enregistrer";
      }
    });

    // --- ÉVÉNEMENTS CLAVIER ---
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      
      // Barre d'espace = Pédale
      if (e.code === 'Space') {
        e.preventDefault();
        setSustain(true);
        return;
      }

      // Flèches gauche/droite = Changement d'octave
      if (e.code === 'ArrowLeft') { updateOctave(-1); return; }
      if (e.code === 'ArrowRight') { updateOctave(1); return; }

      const key = e.key.toLowerCase();
      if (keyNotes[key]) {
        noteOn(key);
        document.querySelector(`[data-key="${key}"]`)?.classList.add('active');
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        setSustain(false);
        return;
      }

      const key = e.key.toLowerCase();
      if (keyNotes[key]) {
        noteOff(key);
        document.querySelector(`[data-key="${key}"]`)?.classList.remove('active');
      }
    });

    // Souris / Touch
    document.querySelectorAll('.piano button').forEach(button => {
      const key = button.getAttribute('data-key');
      button.addEventListener('mousedown', () => {
        noteOn(key);
        button.classList.add('active');
      });
      const stopAction = () => {
        noteOff(key);
        button.classList.remove('active');
      };
      button.addEventListener('mouseup', stopAction);
      button.addEventListener('mouseleave', stopAction);
    });

    window.addEventListener('click', loadSamples, { once: true });
    window.addEventListener('keydown', loadSamples, { once: true });

    // --- BOUTON D'INSTALLATION PWA ---
    let deferredPrompt;
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'block';
    });

    btnInstall.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          btnInstall.style.display = 'none';
        });
      }
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('✅ Service Worker prêt :', reg.scope))
          .catch(err => console.error("❌ Échec Service Worker :", err));
      });
    }
  </script>
</body>
</html>
